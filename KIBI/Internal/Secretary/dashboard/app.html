<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KIBI 全社ダッシュボード</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- ───── 上部バー（ワードマーク＋LIVE＋更新時刻＋テーマ） ───── -->
<header class="topbar">
  <div class="brand">
    <span class="brandname" id="instanceName">KIBI</span>
    <span class="live" id="liveBadge" title="リアルタイム接続状態">
      <span class="livedot" id="liveDot"></span>
      <span class="livetext" id="liveText">未接続</span>
    </span>
  </div>
  <div class="topmeta">
    <span class="updated" id="updatedAt">—</span>
    <button class="themebtn" id="themeBtn" title="テーマ切替" aria-label="テーマ切替">◐</button>
  </div>
</header>

<!-- ───── タブ（概要/組織/課題/承認/連携・data-tabキー不変） ───── -->
<nav class="tabs" id="tabs" role="tablist">
  <button class="tabbtn active" data-tab="overview"  role="tab">概要</button>
  <button class="tabbtn"        data-tab="org"       role="tab">組織</button>
  <button class="tabbtn"        data-tab="tasks"     role="tab">課題</button>
  <button class="tabbtn"        data-tab="approvals" role="tab">承認</button>
  <button class="tabbtn"        data-tab="pipeline"  role="tab">連携</button>
</nav>

<main>
  <!-- 1. 概要 -->
  <section class="panel active" id="panel-overview" role="tabpanel">
    <div class="kpis" id="kpis"></div>
    <h2 class="sec-h">信号灯</h2>
    <div class="signals" id="signals"></div>
    <h2 class="sec-h">直近の動き</h2>
    <ul class="recent" id="recent"></ul>
  </section>

  <!-- 2. 組織（org-flow.js＝別担当が縦化。アプリは container と呼び出しのみ） -->
  <section class="panel" id="panel-org" role="tabpanel">
    <h2 class="sec-h">組織図</h2>
    <div id="orgchart" class="svg-host"></div>
    <h2 class="sec-h">仕事のフロー</h2>
    <div id="flowdiagram" class="svg-host"></div>
    <p class="hint" id="orgFallback" hidden>組織図モジュール（org-flow.js）が読み込まれていません。</p>
  </section>

  <!-- 3. 課題（/api/board?name=tasks を部署別グループ化） -->
  <section class="panel" id="panel-tasks" role="tabpanel">
    <div class="toolbar">
      <button class="btn" id="rebuildBtn">ボード再生成</button>
      <span class="hint" id="rebuildHint"></span>
    </div>
    <div class="filters" id="tasksFilters"></div>
    <div class="groupwrap" id="tasksBody"></div>
  </section>

  <!-- 4. 承認（pipeline.needsHuman ＋ judgments の jdg をカード操作） -->
  <section class="panel" id="panel-approvals" role="tabpanel">
    <div class="filters" id="approvalsFilters"></div>
    <div class="groupwrap" id="approvalCards"></div>
    <!-- judgments md の保持用（パーサが参照・非表示） -->
    <div class="mdbody" id="judgmentsBody" hidden></div>
  </section>

  <!-- 5. 連携（pipeline.orders+cases を vendor/種別でグループ化） -->
  <section class="panel" id="panel-pipeline" role="tabpanel">
    <div class="livehead">
      <span class="live" id="pipeLive">
        <span class="livedot" id="pipeDot"></span>
        <span>LIVE</span>
      </span>
      <span class="updated">最終更新 <b id="pipeUpdated">—</b></span>
    </div>
    <div class="filters" id="pipelineFilters"></div>
    <div class="groupwrap" id="pipelineBody"></div>
    <h2 class="sec-h">ロック・競合</h2>
    <div class="locks" id="locks"></div>
  </section>
</main>

<!-- 組織図/フロー図モジュール（WP-ORG提供・触らない） -->
<script src="org-flow.js"></script>
<script src="app.js"></script>
</body>
</html>
