# Railway deployment for the signal-bot FastAPI engine.
# Service settings to configure in the Railway dashboard:
#   Source repo:       sslocker08/MyWorkSpace
#   Root directory:    signal-bot
#   Watch paths:       signal-bot/engine/**
#
# Add the following services in Railway and Railway will inject their URLs:
#   • PostgreSQL plugin  →  DATABASE_URL (auto-injected)
#   • Redis plugin       →  REDIS_URL    (auto-injected)
#
# Additional environment variables to set manually:
#   SECRET_KEY          (generate with `openssl rand -hex 32`)
#   POLYGON_API_KEY     (free key from polygon.io)
#   FRED_API_KEY        (free key from fred.stlouisfed.org)
#   CORS_ORIGINS        https://<your-pages-project>.pages.dev,http://localhost:3000

[build]
# Uses the existing engine/Dockerfile which compiles TA-Lib from source.
dockerfilePath = "engine/Dockerfile"

[deploy]
# Railway injects $PORT automatically (usually 8000 or 3000).
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
