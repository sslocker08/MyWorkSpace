<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぐにゃファイター</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#02020e;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  height:100vh; overflow:hidden;
  font-family:'Segoe UI',sans-serif; color:#fff;
  user-select:none;
}
canvas { display:block; border-radius:12px; box-shadow:0 0 60px rgba(60,80,255,0.18); }
#ui {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
}
.screen {
  display:none; flex-direction:column; align-items:center; gap:14px;
  background:rgba(4,5,22,0.95); padding:36px 40px;
  border-radius:18px; border:1px solid #1e2856;
  min-width:320px; pointer-events:auto;
  box-shadow:0 0 60px rgba(50,80,255,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
}
.screen.active { display:flex; }
h1 {
  font-size:2.4em; letter-spacing:0.04em;
  background:linear-gradient(135deg,#ff2470,#a040ff,#00e5b0);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
h2 { font-size:1.4em; color:#8090d0; letter-spacing:0.06em; }
p.sub { color:#555; font-size:0.85em; text-align:center; line-height:1.6; }
button {
  padding:12px 0; border:none; border-radius:10px;
  font-size:1.0em; font-weight:700; cursor:pointer;
  width:100%; transition:transform 0.08s, filter 0.08s;
  letter-spacing:0.04em;
}
button:active { transform:scale(0.96); filter:brightness(1.2); }
.btn-p { background:linear-gradient(135deg,#ff2470,#a040ff); color:#fff; }
.btn-s { background:linear-gradient(135deg,#00e5b0,#00b4ff); color:#020e12; }
.btn-g { background:#0e1228; color:#556; border:1px solid #1e2856; }
input[type=text] {
  padding:12px 16px; border:1px solid #1e2856;
  border-radius:10px; background:#080d24; color:#fff;
  font-size:1.6em; text-align:center; letter-spacing:8px;
  width:100%; outline:none; text-transform:uppercase;
}
input[type=text]:focus { border-color:#a040ff; box-shadow:0 0 12px rgba(160,64,255,0.25); }
.code-display {
  font-size:3em; font-weight:900; letter-spacing:12px;
  color:#00e5b0; text-align:center;
  text-shadow:0 0 24px rgba(0,229,176,0.5);
}
.status { color:#556; font-size:0.82em; text-align:center; }
#hud {
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  display:none; gap:30px; pointer-events:none; z-index:10;
}
.score-box {
  text-align:center;
  background:rgba(4,5,22,0.8);
  padding:8px 22px; border-radius:10px;
  border:1px solid #1e2856;
}
.sname { font-size:0.72em; letter-spacing:0.1em; opacity:0.45; margin-bottom:6px; }
.pips { display:flex; gap:8px; justify-content:center; }
.pip {
  width:13px; height:13px; border-radius:50%;
  background:#0a0c1e; border:1px solid #2a3060;
  transition:background 0.15s, box-shadow 0.15s;
}
#p1box .pip.filled { background:#ff2470; border-color:#ff6090; box-shadow:0 0 10px #ff2470; }
#p2box .pip.filled { background:#00e5b0; border-color:#60ffdc; box-shadow:0 0 10px #00e5b0; }
.vs { align-self:center; font-size:0.75em; color:#334; letter-spacing:0.1em; }
#countdown {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:8em; font-weight:900; opacity:0;
  pointer-events:none; z-index:20;
  text-shadow:0 0 50px currentColor;
  transition:opacity 0.2s;
}
.ctrl-table { width:100%; border-collapse:collapse; font-size:0.88em; }
.ctrl-table td { padding:5px 10px; }
.ctrl-table td:first-child { color:#a040ff; font-weight:700; font-size:0.82em; letter-spacing:0.05em; }
.ctrl-table td:last-child { color:#8090a8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="screen active" id="s-title">
    <h1>GUNYA FIGHTER</h1>
    <p class="sub">ぐにゃぐにゃメカで戦う<br>2人オンライン対戦ゲー</p>
    <button class="btn-p" onclick="showHost()">🏠 ホスト（部屋を作る）</button>
    <button class="btn-s" onclick="showJoin()">🔗 参加（コードで入る）</button>
  </div>
  <div class="screen" id="s-host">
    <h2>HOST</h2>
    <p class="sub" id="hst-wait">接続サーバーに繋いでいます…</p>
    <div class="code-display" id="hst-code">- - - -</div>
    <p class="sub" id="hst-tip">このコードを相手に送ってください</p>
    <button class="btn-g" onclick="goTitle()">← タイトルへ</button>
  </div>
  <div class="screen" id="s-join">
    <h2>JOIN</h2>
    <p class="sub">ホストから受け取ったコードを入力</p>
    <input type="text" id="join-input" maxlength="4" placeholder="XXXX"
           oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
    <button class="btn-s" onclick="doJoin()">接続する</button>
    <p class="status" id="join-st"></p>
    <button class="btn-g" onclick="goTitle()">← タイトルへ</button>
  </div>
  <div class="screen" id="s-round">
    <h2 id="rnd-title">ROUND</h2>
    <p class="sub" id="rnd-sub"></p>
    <button class="btn-g" id="rnd-back" style="display:none" onclick="goTitle()">← タイトルへ戻る</button>
  </div>
  <div class="screen" id="s-controls">
    <h2>CONTROLS</h2>
    <table class="ctrl-table">
      <tr><td>P1 HOST</td><td>A / D = 移動 &nbsp; W = ジャンプ &nbsp; S = パンチ</td></tr>
      <tr><td>P2 GUEST</td><td>← / → = 移動 &nbsp; ↑ = ジャンプ &nbsp; ↓ = パンチ</td></tr>
    </table>
    <p class="sub">先に3ポイント取ったほうが勝ち！<br>プラットフォームから落ちたら負け</p>
  </div>
</div>
<div id="hud">
  <div class="score-box" id="p1box">
    <div class="sname">P1 ▸ HOST</div>
    <div class="pips" id="p1pips"></div>
  </div>
  <div class="vs">VS</div>
  <div class="score-box" id="p2box">
    <div class="sname">P2 ▸ GUEST</div>
    <div class="pips" id="p2pips"></div>
  </div>
</div>
<div id="countdown"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';

// ════════════════════════════════════
//  Canvas & resize
// ════════════════════════════════════
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W = 0, H = 0;
function resize() {
  const maxW = Math.min(window.innerWidth, 960);
  const maxH = Math.min(window.innerHeight, 640);
  const ratio = 3 / 2;
  if (maxW / maxH > ratio) { H = maxH; W = H * ratio; }
  else { W = maxW; H = W / ratio; }
  cv.width = W; cv.height = H;
}
resize();
window.addEventListener('resize', () => { resize(); if (GAME) GAME.resize(); });

// ════════════════════════════════════
//  Sound System (Web Audio API)
// ════════════════════════════════════
let AC = null;
function getAC() {
  if (!AC) AC = new AudioContext();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function _osc(ac, type, freq, vol, t, decay) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + decay + 0.02);
}
function sndHit() {
  const ac = getAC(), t = ac.currentTime;
  const len = Math.floor(ac.sampleRate * 0.08);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const filt = ac.createBiquadFilter(); filt.type = 'bandpass';
  filt.frequency.value = 340 + Math.random() * 80; filt.Q.value = 1.1;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.65, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  src.connect(filt); filt.connect(g); g.connect(ac.destination); src.start(t);
  const o = ac.createOscillator();
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.07);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.5, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  o.connect(g2); g2.connect(ac.destination); o.start(t); o.stop(t + 0.09);
}
function sndJump() {
  const ac = getAC(), t = ac.currentTime;
  const freq = 160 + Math.random() * 40;
  const o = ac.createOscillator();
  o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 2.5, t + 0.13);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.16);
}
function sndLand() {
  const ac = getAC(), t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(28, t + 0.07);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.09);
}
function sndDeath() {
  const ac = getAC(), t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(460, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.5);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.55);
}
function sndWin() {
  const ac = getAC();
  [523, 659, 784, 1047].forEach((freq, i) => {
    const t = ac.currentTime + i * 0.11;
    _osc(ac, 'sine', freq, 0.16, t, 0.22);
  });
}
function sndBeep(freq, vol = 0.18, dur = 0.1) {
  const ac = getAC(), t = ac.currentTime;
  _osc(ac, 'sine', freq, vol, t, dur);
}

// ════════════════════════════════════
//  Physics constants
// ════════════════════════════════════
const DT = 1 / 60, DT2 = DT * DT;
const GRAVITY = 1400, DRAG = 0.982;

// ════════════════════════════════════
//  Verlet Particle
// ════════════════════════════════════
class P {
  constructor(x, y, mass = 1) {
    this.x = x; this.y = y; this.ox = x; this.oy = y;
    this.fx = 0; this.fy = 0; this.mass = mass;
  }
  push(fx, fy) { this.fx += fx; this.fy += fy; }
  step(gravity, damp) {
    const vx = (this.x - this.ox) * damp + this.fx / this.mass * DT2;
    const vy = (this.y - this.oy) * damp + (this.fy / this.mass + gravity) * DT2;
    this.ox = this.x; this.oy = this.y;
    this.x += vx; this.y += vy;
    this.fx = 0; this.fy = 0;
  }
}

// ════════════════════════════════════
//  Spring Constraint
// ════════════════════════════════════
class Spring {
  constructor(a, b, rest, k) {
    this.a = a; this.b = b;
    this.rest = rest ?? Math.hypot(b.x - a.x, b.y - a.y);
    this.k = k;
  }
  solve() {
    const dx = this.b.x - this.a.x, dy = this.b.y - this.a.y;
    const d = Math.hypot(dx, dy) || 0.001;
    const f = (d - this.rest) * this.k * 0.5 / d;
    this.a.x += dx * f; this.a.y += dy * f;
    this.b.x -= dx * f; this.b.y -= dy * f;
  }
}

// ════════════════════════════════════
//  3-D rendering helpers (canvas 2-D)
// ════════════════════════════════════
// Cylindrical limb: perpendicular gradient for cylinder shading
function drawCyl(x1, y1, x2, y2, r, baseC, hiC, shadowC) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 0.001;
  const nx = -dy / len, ny = dx / len;
  const mx = (x1 + x2) * 0.5, my = (y1 + y2) * 0.5;
  const g = cx.createLinearGradient(mx + nx * r, my + ny * r, mx - nx * r, my - ny * r);
  g.addColorStop(0,    shadowC);
  g.addColorStop(0.22, baseC);
  g.addColorStop(0.52, hiC);
  g.addColorStop(0.80, baseC);
  g.addColorStop(1,    shadowC);
  cx.strokeStyle = g; cx.lineWidth = r * 2; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke();
}

// Sphere: offset radial gradient for 3-D shading
function drawSph(x, y, r, baseC, hiC, shadowC) {
  const g = cx.createRadialGradient(x - r * 0.32, y - r * 0.36, r * 0.04,
                                     x + r * 0.08, y + r * 0.10, r);
  g.addColorStop(0,    hiC);
  g.addColorStop(0.22, baseC);
  g.addColorStop(0.75, shadowC);
  g.addColorStop(1,    '#01010a');
  cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
}

// ════════════════════════════════════
//  Platform (tilting seesaw) — sci-fi look
// ════════════════════════════════════
class Platform {
  constructor() { this.reset(); }
  reset() { this.angle = 0; this.avel = 0; this.bob = 0; this.bobV = 0; }
  update(x1, x2) {
    const wc = W / 2;
    const lean = ((x1 > wc ? 1 : -1) + (x2 > wc ? 1 : -1)) * 0.0015;
    this.avel = (this.avel + lean) * 0.93;
    this.angle = Math.max(-0.38, Math.min(0.38, this.angle + this.avel));
    this.bobV += (0 - this.bob) * 0.04; this.bobV *= 0.88; this.bob += this.bobV;
  }
  surfaceY(wx) { return H * 0.58 + this.bob + Math.sin(this.angle) * (wx - W / 2); }
  halfW() { return W * 0.28; }
  hit(energy) { this.bobV += energy; }
  inRange(wx) { return Math.abs(wx - W / 2) < this.halfW() + 10; }
  draw() {
    cx.save();
    cx.translate(W / 2, H * 0.58 + this.bob);
    cx.rotate(this.angle);
    const hw = this.halfW(), th = 13;
    // Drop shadow
    cx.fillStyle = 'rgba(0,0,0,0.3)';
    cx.beginPath(); cx.ellipse(0, th + 10, hw * 0.85, 9, 0, 0, Math.PI * 2); cx.fill();
    // Main body — metallic gradient
    const mg = cx.createLinearGradient(-hw, 0, hw, 0);
    mg.addColorStop(0,   '#04071a');
    mg.addColorStop(0.15,'#111c3c');
    mg.addColorStop(0.5, '#1e2d58');
    mg.addColorStop(0.85,'#111c3c');
    mg.addColorStop(1,   '#04071a');
    cx.fillStyle = mg;
    cx.beginPath(); roundRect(cx, -hw, 0, hw * 2, th, 5); cx.fill();
    // Top-surface sheen
    cx.fillStyle = 'rgba(150,180,255,0.12)';
    cx.beginPath(); roundRect(cx, -hw + 5, 1, hw * 2 - 10, 5, 3); cx.fill();
    // Top rail glow
    const rg = cx.createLinearGradient(-hw, 0, hw, 0);
    rg.addColorStop(0,   'rgba(60,100,255,0)');
    rg.addColorStop(0.08,'rgba(100,150,255,0.9)');
    rg.addColorStop(0.92,'rgba(100,150,255,0.9)');
    rg.addColorStop(1,   'rgba(60,100,255,0)');
    cx.strokeStyle = rg; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(-hw + 4, 1); cx.lineTo(hw - 4, 1); cx.stroke();
    // Bottom glow
    cx.shadowBlur = 16; cx.shadowColor = 'rgba(80,120,255,0.8)';
    cx.strokeStyle = 'rgba(70,110,255,0.5)'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(-hw + 5, th); cx.lineTo(hw - 5, th); cx.stroke();
    cx.shadowBlur = 0;
    // Pivot indicator
    cx.fillStyle = 'rgba(100,150,255,0.4)';
    cx.beginPath(); cx.arc(0, th * 0.5, 3, 0, Math.PI * 2); cx.fill();
    cx.restore();
  }
}

function roundRect(c, x, y, w, h, r) {
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h); c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r);
  c.closePath();
}

// ════════════════════════════════════
//  Character — mech-armor soft body
// ════════════════════════════════════
const PI = { PEL:0, CHE:1, HEA:2, LSH:3, LEL:4, LHA:5, RSH:6, REL:7, RHA:8,
              LHI:9, LKN:10, LFT:11, RHI:12, RKN:13, RFT:14 };

class Character {
  constructor(x, y, color, isP1) {
    this.color = color; this.isP1 = isP1;
    this.onGround = false; this.dead = false;
    this.facing = isP1 ? 1 : -1;
    this.atkCD = 0; this.atkAnim = 0; this.hitFlash = 0;
    this.jumpCooldown = 0; this.jumpBuffer = 0;
    this.squashT = 0; this.squashDir = 'land';
    this.landEvent = false; this.jumpEvent = false;
    this.netLand = false; this.netJump = false;
    this.trail = []; this._trailHx = 0; this._trailHy = 0;
    this._build(x, y);
  }
  _build(x, y) {
    const s = this._s = H * 0.048;
    const ps = (ix, iy) => new P(x + ix * s, y + iy * s, 1);
    this.pts = [
      ps(0, 0), ps(0, -1.6), ps(0, -3.2),
      ps(-1.1, -1.4), ps(-2.0, -0.5), ps(-2.8, 0.5),
      ps( 1.1, -1.4), ps( 2.0, -0.5), ps( 2.8, 0.5),
      ps(-0.55, 0), ps(-0.55, 1.6), ps(-0.55, 3.2),
      ps( 0.55, 0), ps( 0.55, 1.6), ps( 0.55, 3.2),
    ];
    const p = this.pts;
    const sp = (a, b, k) => new Spring(p[a], p[b], undefined, k);
    const bs = 0.28, ls = 0.12;
    this.springs = [
      sp(PI.PEL, PI.CHE, bs), sp(PI.CHE, PI.HEA, bs), sp(PI.PEL, PI.HEA, bs * 0.5),
      sp(PI.CHE, PI.LSH, bs), sp(PI.LSH, PI.LEL, ls), sp(PI.LEL, PI.LHA, ls),
      sp(PI.CHE, PI.RSH, bs), sp(PI.RSH, PI.REL, ls), sp(PI.REL, PI.RHA, ls),
      sp(PI.PEL, PI.LHI, bs), sp(PI.LHI, PI.LKN, ls), sp(PI.LKN, PI.LFT, ls),
      sp(PI.PEL, PI.RHI, bs), sp(PI.RHI, PI.RKN, ls), sp(PI.RKN, PI.RFT, ls),
      sp(PI.LHI, PI.RHI, bs),
    ];
  }
  p(i) { return this.pts[i]; }

  applyInput(inp, plat) {
    const s = this._s;
    const pel = this.p(PI.PEL);

    // ── Movement: velocity-targeting (fixes "飛んでしまう" bug) ──
    // Instead of applying a huge force, we blend the pelvis velocity
    // toward a target walk speed each frame.
    const WALK_V = s * 0.34; // target speed in px/frame (~600 px/s)
    const vx = pel.x - pel.ox;
    if (inp.left) {
      this.facing = -1;
      pel.ox = pel.x - (vx * 0.74 + (-WALK_V) * 0.26);
    } else if (inp.right) {
      this.facing = 1;
      pel.ox = pel.x - (vx * 0.74 + WALK_V * 0.26);
    } else if (this.onGround) {
      // Ground friction: quick stop when no input
      pel.ox = pel.x - vx * 0.80;
    }

    // Jump with 6-frame input buffer
    if (inp.jump) this.jumpBuffer = Math.max(this.jumpBuffer, 6);
    if (this.jumpBuffer > 0 && this.onGround && this.jumpCooldown <= 0) {
      const jf = -s * 5.5 / DT; // reduced from 8.5 to keep on screen
      pel.oy = pel.y - jf * DT;
      this.onGround = false; this.jumpCooldown = 20; this.jumpBuffer = 0;
      if (plat) plat.hit(-2.5);
      this.squashT = 0.85; this.squashDir = 'jump';
      this.jumpEvent = true;
    }
    if (this.jumpBuffer > 0) this.jumpBuffer--;

    if (inp.punch && this.atkCD <= 0) {
      this.atkCD = 35; this.atkAnim = 22;
      const hIdx = this.facing === 1 ? PI.RHA : PI.LHA;
      const eIdx = this.facing === 1 ? PI.REL : PI.LEL;
      const pf = s * 3800; // reduced from 5000
      this.p(hIdx).push(this.facing * pf, -pf * 0.5);
      this.p(eIdx).push(this.facing * pf * 0.4, -pf * 0.25);
    }
  }

  update(plat) {
    if (this.atkCD > 0) this.atkCD--;
    if (this.atkAnim > 0) this.atkAnim--;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.jumpCooldown > 0) this.jumpCooldown--;
    if (this.squashT > 0) this.squashT = Math.max(0, this.squashT - 0.07);
    for (const pt of this.pts) pt.step(GRAVITY, DRAG);
    for (let i = 0; i < 10; i++) for (const sp of this.springs) sp.solve();
    const wasOnGround = this.onGround;
    this.onGround = false;
    if (plat) {
      for (const pt of this.pts) {
        if (plat.inRange(pt.x)) {
          const sy = plat.surfaceY(pt.x);
          if (pt.y > sy) { pt.y = sy; if (pt.y - pt.oy > 0) pt.oy = pt.y; this.onGround = true; }
        }
      }
    }
    if (!wasOnGround && this.onGround) {
      this.landEvent = true; this.squashT = 1.0; this.squashDir = 'land';
    }
    for (const pt of this.pts) {
      if (pt.x < -W * 0.15) { pt.x = -W * 0.15; pt.ox = pt.x; }
      if (pt.x >  W * 1.15) { pt.x =  W * 1.15; pt.ox = pt.x; }
      if (pt.y < -H * 0.5)  { pt.y = -H * 0.5;  pt.oy = pt.y; }
    }
    if (this.p(PI.PEL).y > H + 120) this.dead = true;
  }

  checkHit(other) {
    if (this.atkAnim <= 0) return false;
    const hIdx = this.facing === 1 ? PI.RHA : PI.LHA;
    const hand = this.p(hIdx);
    const oPel = other.p(PI.PEL);
    if (Math.hypot(hand.x - oPel.x, hand.y - oPel.y) < this._s * 3.5) {
      const f = this._s * 4200;
      oPel.push(this.facing * f, -f * 0.5);
      other.p(PI.CHE).push(this.facing * f * 0.35, -f * 0.25);
      other.hitFlash = 18; this.atkAnim = 0; return true;
    }
    return false;
  }

  pushApart(other) {
    const pairs = [[PI.PEL,PI.PEL],[PI.CHE,PI.CHE],[PI.PEL,PI.CHE],[PI.CHE,PI.PEL]];
    const minD = this._s * 2.2;
    for (const [ai, bi] of pairs) {
      const a = this.p(ai), b = other.p(bi);
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      if (d < minD && d > 0.001) {
        const ov = (minD - d) / d * 0.4;
        a.x -= dx * ov * 0.5; a.y -= dy * ov * 0.5;
        b.x += dx * ov * 0.5; b.y += dy * ov * 0.5;
      }
    }
  }

  serialize() { return this.pts.map(pt => [pt.x, pt.y, pt.ox, pt.oy]); }
  deserialize(d) { d.forEach((v, i) => { this.pts[i].x = v[0]; this.pts[i].y = v[1]; this.pts[i].ox = v[2]; this.pts[i].oy = v[3]; }); }

  draw() {
    const s = this._s;
    const hd = this.pts[PI.HEA];
    const pel = this.pts[PI.PEL];
    const pts = this.pts;

    // Afterimage trail (velocity-based)
    const spd = Math.hypot(hd.x - this._trailHx, hd.y - this._trailHy);
    if (spd > 4.5) {
      this.trail.unshift({ x: hd.x, y: hd.y });
      if (this.trail.length > 7) this.trail.pop();
    } else if (this.trail.length > 0) {
      this.trail.pop();
    }
    this._trailHx = hd.x; this._trailHy = hd.y;
    const n = this.trail.length;
    if (n > 0) {
      this.trail.forEach((tr, i) => {
        cx.globalAlpha = ((n - i) / n) * 0.14;
        cx.fillStyle = this.isP1 ? '#ff2470' : '#00e5b0';
        cx.beginPath(); cx.arc(tr.x, tr.y, s * 0.95, 0, Math.PI * 2); cx.fill();
      });
      cx.globalAlpha = 1;
    }

    // Color palette
    const fl = this.hitFlash > 0 && (Math.floor(this.hitFlash / 3) % 2 === 0);
    const ACC  = fl ? '#ffffff' : (this.isP1 ? '#ff2470' : '#00e5b0');
    const ACCD = fl ? '#888888' : (this.isP1 ? '#7a0030' : '#006640');
    const M    = fl ? '#c8d0e8' : '#1c2238'; // metal base
    const MH   = fl ? '#ffffff' : '#4c5880'; // metal highlight
    const MS   = fl ? '#666677' : '#070a1a'; // metal shadow
    const MSP  = fl ? '#ffffff' : '#a0b0d0'; // metal specular

    // Squash & stretch transform around body center
    const ccx = (pel.x + hd.x) * 0.5;
    const ccy = (pel.y + hd.y) * 0.5;
    cx.save();
    if (this.squashT > 0) {
      const t = this.squashT;
      const sx = this.squashDir === 'land' ?  t * 0.20 : -t * 0.10;
      const sy = this.squashDir === 'land' ? -t * 0.20 :  t * 0.25;
      cx.translate(ccx, ccy); cx.scale(1 + sx, 1 + sy); cx.translate(-ccx, -ccy);
    }

    // ── LEGS ──
    const lhi = pts[PI.LHI], lkn = pts[PI.LKN], lft = pts[PI.LFT];
    const rhi = pts[PI.RHI], rkn = pts[PI.RKN], rft = pts[PI.RFT];
    drawCyl(lhi.x, lhi.y, lkn.x, lkn.y, s*0.34, M, MSP, MS);
    drawCyl(lkn.x, lkn.y, lft.x, lft.y, s*0.28, M, MH,  MS);
    drawCyl(rhi.x, rhi.y, rkn.x, rkn.y, s*0.34, M, MSP, MS);
    drawCyl(rkn.x, rkn.y, rft.x, rft.y, s*0.28, M, MH,  MS);
    // Knee joints (accent color)
    drawSph(lkn.x, lkn.y, s*0.24, ACC, '#ffffff', ACCD);
    drawSph(rkn.x, rkn.y, s*0.24, ACC, '#ffffff', ACCD);

    // ── ARMS ──
    const lsh = pts[PI.LSH], lel = pts[PI.LEL], lha = pts[PI.LHA];
    const rsh = pts[PI.RSH], rel = pts[PI.REL], rha = pts[PI.RHA];
    drawCyl(lsh.x, lsh.y, lel.x, lel.y, s*0.28, M, MSP, MS);
    drawCyl(lel.x, lel.y, lha.x, lha.y, s*0.22, M, MH,  MS);
    drawCyl(rsh.x, rsh.y, rel.x, rel.y, s*0.28, M, MSP, MS);
    drawCyl(rel.x, rel.y, rha.x, rha.y, s*0.22, M, MH,  MS);
    // Elbow joints
    drawSph(lel.x, lel.y, s*0.19, M, MH, MS);
    drawSph(rel.x, rel.y, s*0.19, M, MH, MS);

    // ── TORSO (armored chestplate) ──
    const che = pts[PI.CHE];
    const tAng = Math.atan2(che.y - pel.y, che.x - pel.x) + Math.PI * 0.5;
    const tCX = (pel.x + che.x) * 0.5, tCY = (pel.y + che.y) * 0.5;
    cx.save();
    cx.translate(tCX, tCY); cx.rotate(tAng);
    const tw = s * 1.0, th2 = s * 1.3;
    const tg = cx.createLinearGradient(-tw, 0, tw, 0);
    tg.addColorStop(0,    MS);
    tg.addColorStop(0.22, M);
    tg.addColorStop(0.58, MSP);
    tg.addColorStop(0.82, MH);
    tg.addColorStop(1,    MS);
    cx.fillStyle = tg;
    cx.beginPath(); roundRect(cx, -tw, -th2, tw * 2, th2 * 2, s * 0.18); cx.fill();
    // Chest energy orb
    const og = cx.createRadialGradient(-s*0.04, -s*0.08, 0, 0, 0, s*0.32);
    og.addColorStop(0, '#ffffff'); og.addColorStop(0.3, ACC); og.addColorStop(1, ACCD + '33');
    cx.fillStyle = og; cx.beginPath(); cx.arc(0, -s*0.1, s*0.28, 0, Math.PI*2); cx.fill();
    // Horizontal vent lines
    cx.strokeStyle = ACC + '60'; cx.lineWidth = 1.2;
    for (let i = -1; i <= 1; i++) {
      cx.beginPath(); cx.moveTo(-tw*0.5, s*0.25 + i*s*0.18); cx.lineTo(tw*0.5, s*0.25 + i*s*0.18); cx.stroke();
    }
    cx.restore();

    // Shoulder pads
    drawSph(lsh.x, lsh.y, s*0.28, M, MH, MS);
    drawSph(rsh.x, rsh.y, s*0.28, M, MH, MS);
    // Hip joints
    drawSph(lhi.x, lhi.y, s*0.21, M, MH, MS);
    drawSph(rhi.x, rhi.y, s*0.21, M, MH, MS);

    // ── FISTS ──
    const punchH = this.facing === 1 ? PI.RHA : PI.LHA;
    const isPunching = this.atkAnim > 0;
    for (const hi of [PI.LHA, PI.RHA]) {
      const h = pts[hi];
      const isAtk = isPunching && hi === punchH;
      const fr = s * (isAtk ? 0.48 : 0.36);
      drawSph(h.x, h.y, fr, isAtk ? ACC : M, isAtk ? '#fff' : MH, isAtk ? ACCD : MS);
      if (isAtk) {
        cx.strokeStyle = ACC; cx.lineWidth = 2; cx.globalAlpha = 0.5;
        cx.beginPath(); cx.arc(h.x, h.y, fr * 1.85, 0, Math.PI * 2); cx.stroke();
        cx.globalAlpha = 1;
      }
    }

    // ── FEET (angular armored boots) ──
    for (const fi of [PI.LFT, PI.RFT]) {
      const f = pts[fi];
      cx.save(); cx.translate(f.x, f.y);
      const bg = cx.createLinearGradient(-s*0.52, 0, s*0.52, 0);
      bg.addColorStop(0, MS); bg.addColorStop(0.32, M); bg.addColorStop(0.65, MH); bg.addColorStop(1, MS);
      cx.fillStyle = bg;
      cx.beginPath();
      cx.moveTo(-s*0.45, -s*0.16);
      cx.lineTo(s*0.28 + this.facing * s*0.24, -s*0.10);
      cx.lineTo(s*0.38 + this.facing * s*0.24,  s*0.20);
      cx.lineTo(-s*0.45,  s*0.20);
      cx.closePath(); cx.fill();
      // Accent stripe on boot
      cx.strokeStyle = ACC; cx.lineWidth = 1.2; cx.globalAlpha = 0.55;
      cx.beginPath(); cx.moveTo(-s*0.38, s*0.02); cx.lineTo(s*0.24 + this.facing*s*0.18, s*0.02); cx.stroke();
      cx.globalAlpha = 1;
      cx.restore();
    }

    // ── HEAD (robot helmet) ──
    const hr = s * 1.08;
    drawSph(hd.x, hd.y, hr, M, MSP, MS);

    // Ear plates
    for (const side of [-1, 1]) {
      const ex = hd.x + side * hr * 0.86;
      const ey = hd.y - hr * 0.08;
      cx.fillStyle = M;
      cx.beginPath(); cx.ellipse(ex, ey, s*0.20, s*0.30, 0, 0, Math.PI*2); cx.fill();
      cx.fillStyle = ACC; cx.globalAlpha = 0.45;
      cx.beginPath(); cx.arc(ex, ey + s*0.1, s*0.055, 0, Math.PI*2); cx.fill();
      cx.globalAlpha = 1;
    }

    // Visor glow band
    cx.save();
    cx.translate(hd.x + this.facing * hr * 0.16, hd.y - hr * 0.04);
    const vw = hr * 0.80, vh = hr * 0.24;
    const vg = cx.createLinearGradient(-vw, 0, vw, 0);
    vg.addColorStop(0,    ACCD + '44');
    vg.addColorStop(0.12, ACC + 'bb');
    vg.addColorStop(0.42, '#ffffffcc');
    vg.addColorStop(0.72, ACC + 'cc');
    vg.addColorStop(1,    ACCD + '44');
    cx.fillStyle = vg;
    cx.beginPath(); cx.ellipse(0, 0, vw, vh, 0, 0, Math.PI * 2); cx.fill();
    // Inner specular
    cx.strokeStyle = '#ffffff'; cx.lineWidth = 1.5; cx.globalAlpha = 0.6;
    cx.beginPath(); cx.ellipse(0, -vh * 0.22, vw * 0.65, vh * 0.32, 0, -Math.PI, 0); cx.stroke();
    cx.globalAlpha = 1;
    cx.restore();

    // Antenna
    const hax = hd.x + this.facing * hr * 0.18;
    const hay = hd.y - hr * 0.92;
    drawCyl(hax, hay, hax, hay - s * 0.55, s * 0.045, M, MSP, MS);
    drawSph(hax, hay - s * 0.55, s * 0.095, ACC, '#fff', ACCD);

    cx.restore(); // end squash transform
  }
}

// ════════════════════════════════════
//  Sparks (particles)
// ════════════════════════════════════
class Sparks {
  constructor() { this.ps = []; }
  burst(x, y, n, col, dirX = 0, dirY = -1) {
    const base = Math.atan2(dirY, dirX);
    for (let i = 0; i < n; i++) {
      const a = base + (Math.random() - 0.5) * Math.PI * 1.4;
      const sp = Math.random() * 9 + 3;
      this.ps.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2, life:1, col, size:2+Math.random()*3, type:'spark' });
    }
  }
  dust(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI*0.5 + (Math.random()-0.5)*Math.PI;
      const sp = Math.random()*3+0.5;
      this.ps.push({ x:x+(Math.random()-0.5)*28, y, vx:Math.cos(a)*sp*2, vy:-Math.random()*2.5-0.5, life:1, col:'rgba(140,160,220,0.6)', size:7+Math.random()*9, type:'dust' });
    }
  }
  update() {
    this.ps = this.ps.filter(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.type==='spark') { p.vy+=0.35; p.life-=0.038; }
      else { p.vy+=0.04; p.vx*=0.86; p.life-=0.026; }
      return p.life > 0;
    });
  }
  draw() {
    for (const p of this.ps) {
      cx.globalAlpha = p.type==='dust' ? p.life*0.65 : p.life*p.life;
      cx.fillStyle = p.col;
      const r = p.type==='dust' ? p.size*(p.life*0.6+0.4) : p.size;
      cx.beginPath(); cx.arc(p.x, p.y, r, 0, Math.PI*2); cx.fill();
    }
    cx.globalAlpha = 1;
  }
}

// ════════════════════════════════════
//  Background — deep space + grid
// ════════════════════════════════════
const STARS = Array.from({ length: 80 }, (_, i) => ({
  x: Math.sin(i * 2.371) * 0.5 + 0.5,
  y: Math.sin(i * 3.713) * 0.5 + 0.5,
  r: Math.sin(i * 1.537) * 0.5 + 1.0,
  a: Math.sin(i * 0.921) * 0.3 + 0.5,
}));

function drawBg() {
  // Deep space gradient
  const g = cx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,   '#02020f');
  g.addColorStop(0.5, '#050820');
  g.addColorStop(1,   '#080c28');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);

  // Stars
  for (const s of STARS) {
    cx.globalAlpha = s.a;
    cx.fillStyle = '#fff';
    cx.beginPath(); cx.arc(s.x*W, s.y*H*0.65, s.r, 0, Math.PI*2); cx.fill();
  }
  cx.globalAlpha = 1;

  // Horizon nebula glow
  const ng = cx.createRadialGradient(W*0.5, H*0.58, 0, W*0.5, H*0.58, W*0.55);
  ng.addColorStop(0,   'rgba(30,50,180,0.10)');
  ng.addColorStop(0.5, 'rgba(20,20,100,0.06)');
  ng.addColorStop(1,   'transparent');
  cx.fillStyle = ng; cx.fillRect(0, H*0.35, W, H*0.65);

  // Perspective grid (floor)
  const gridBase = H * 0.60;
  const vp = { x: W * 0.5, y: H * 0.38 };
  cx.lineWidth = 1;
  // Radial lines
  for (let i = 0; i <= 16; i++) {
    const bx = (i / 16) * W;
    cx.strokeStyle = 'rgba(50,80,200,0.07)';
    cx.beginPath(); cx.moveTo(vp.x, vp.y); cx.lineTo(bx, H); cx.stroke();
  }
  // Horizontal rings
  for (let j = 0; j <= 6; j++) {
    const t = j / 6;
    const y = gridBase + (H - gridBase) * (t * t);
    cx.globalAlpha = (1 - t) * 0.18;
    cx.strokeStyle = 'rgba(80,120,255,1)';
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
  }
  cx.globalAlpha = 1;
}

// ════════════════════════════════════
//  Game
// ════════════════════════════════════
class Game {
  constructor(role, sendFn) {
    this.role = role; this.send = sendFn;
    this.score = [0, 0];
    this.sparks = new Sparks();
    this.trauma = 0; this.shX = 0; this.shY = 0;
    this.hitStop = 0; this._netHit = false;
    this.phase = 'idle';
    this._initRound();
  }
  _initRound() {
    this.plat = new Platform();
    const cx0 = W / 2, cy0 = H * 0.58 - H * 0.14;
    this.chars = [
      new Character(cx0 - W*0.13, cy0, '#ff2470', true),
      new Character(cx0 + W*0.13, cy0, '#00e5b0', false),
    ];
    this.p1in = { left:false, right:false, jump:false, punch:false };
    this.p2in = { left:false, right:false, jump:false, punch:false };
    this.phase = 'idle';
    this.trauma = 0; this.shX = 0; this.shY = 0;
    this.hitStop = 0; this._netHit = false;
  }
  resize() {
    const score = [...this.score], phase = this.phase;
    this._initRound(); this.score = score; this.phase = phase; updateHUD(score);
  }
  _addTrauma(t) { this.trauma = Math.min(1, this.trauma + t); }
  update() {
    if (this.phase !== 'playing') return;
    this.trauma = Math.max(0, this.trauma - 0.038);
    const sh = this.trauma * this.trauma * 20;
    this.shX = (Math.random()*2-1) * sh;
    this.shY = (Math.random()*2-1) * sh;
    if (this.hitStop > 0) { this.hitStop--; this.sparks.update(); return; }
    const [c1, c2] = this.chars;
    const plat = this.plat;
    if (this.role === 'host') {
      c1.applyInput(this.p1in, plat);
      c2.applyInput(this.p2in, plat);
      c1.update(plat); c2.update(plat);
      c1.pushApart(c2);
      plat.update(c1.p(PI.PEL).x, c2.p(PI.PEL).x);
      if (c1.landEvent) { sndLand(); this.sparks.dust(c1.p(PI.LFT).x, plat.surfaceY(c1.p(PI.LFT).x), 7); c1.netLand=true; c1.landEvent=false; }
      if (c2.landEvent) { sndLand(); this.sparks.dust(c2.p(PI.LFT).x, plat.surfaceY(c2.p(PI.LFT).x), 7); c2.netLand=true; c2.landEvent=false; }
      if (c1.jumpEvent) { sndJump(); c1.netJump=true; c1.jumpEvent=false; }
      if (c2.jumpEvent) { sndJump(); c2.netJump=true; c2.jumpEvent=false; }
      if (c1.checkHit(c2)) { sndHit(); this.sparks.burst(c2.p(PI.PEL).x,c2.p(PI.PEL).y,18,'#ff2470',c1.facing,-0.4); this._addTrauma(0.65); this.hitStop=5; this._netHit=true; }
      if (this.hitStop===0 && c2.checkHit(c1)) { sndHit(); this.sparks.burst(c1.p(PI.PEL).x,c1.p(PI.PEL).y,18,'#00e5b0',c2.facing,-0.4); this._addTrauma(0.65); this.hitStop=5; this._netHit=true; }
      if (c1.dead || c2.dead) {
        const winner = c1.dead&&!c2.dead ? 2 : !c1.dead&&c2.dead ? 1 : 0;
        this._endRound(winner);
      }
    }
    this.sparks.update();
  }
  _endRound(winner) {
    this.phase = 'roundEnd';
    if (winner !== 0) this.score[winner-1]++;
    updateHUD(this.score);
    const gameOver = this.score[0]>=3 || this.score[1]>=3;
    const msg = gameOver
      ? (this.score[0]>=3 ? '🏆 P1 WINS!' : '🏆 P2 WINS!')
      : (winner===1 ? '🩷 P1 POINT' : winner===2 ? '💚 P2 POINT' : 'DRAW');
    const sub = `${this.score[0]}  –  ${this.score[1]}`;
    if (winner!==0) sndDeath();
    if (gameOver) setTimeout(sndWin, 280);
    showRoundScreen(msg, sub, gameOver);
    this.send({ t:'rnd', w:winner, sc:[...this.score], over:gameOver });
    if (!gameOver) {
      setTimeout(() => {
        hideRoundScreen();
        const score = [...this.score]; this._initRound(); this.score=score; this.phase='playing';
      }, 2600);
    }
  }
  applyState(st) {
    this.chars[0].deserialize(st.p1); this.chars[1].deserialize(st.p2);
    this.chars[0].dead=st.d1; this.chars[1].dead=st.d2;
    this.plat.angle=st.pa; this.plat.bob=st.pb;
    this.chars[0].facing=st.f1; this.chars[1].facing=st.f2;
    this.chars[0].atkAnim=st.a1; this.chars[1].atkAnim=st.a2;
    this.chars[0].hitFlash=st.h1; this.chars[1].hitFlash=st.h2;
    if (st.ev) {
      if (st.ev.l1) { sndLand(); this.chars[0].squashT=1.0; this.chars[0].squashDir='land'; }
      if (st.ev.j1) { sndJump(); this.chars[0].squashT=0.85; this.chars[0].squashDir='jump'; }
      if (st.ev.l2) { sndLand(); this.chars[1].squashT=1.0; this.chars[1].squashDir='land'; }
      if (st.ev.j2) { sndJump(); this.chars[1].squashT=0.85; this.chars[1].squashDir='jump'; }
      if (st.ev.hit) { sndHit(); this._addTrauma(0.6); }
    }
    for (const c of this.chars) if (c.squashT>0) c.squashT=Math.max(0,c.squashT-0.07);
    this.sparks.update();
    this.trauma=Math.max(0,this.trauma-0.038);
    const sh=this.trauma*this.trauma*20;
    this.shX=(Math.random()*2-1)*sh; this.shY=(Math.random()*2-1)*sh;
  }
  serializeState() {
    const [c1,c2]=this.chars;
    return {
      p1:c1.serialize(), p2:c2.serialize(),
      d1:c1.dead, d2:c2.dead,
      pa:this.plat.angle, pb:this.plat.bob,
      f1:c1.facing, f2:c2.facing,
      a1:c1.atkAnim, a2:c2.atkAnim,
      h1:c1.hitFlash, h2:c2.hitFlash,
      ev:{l1:c1.netLand,j1:c1.netJump,l2:c2.netLand,j2:c2.netJump,hit:this._netHit},
    };
  }
  applyRoundResult(d) {
    if (d.sc) { this.score=d.sc; updateHUD(d.sc); }
    const msg = d.over
      ? (d.sc[0]>=3 ? '🏆 P1 WINS!' : '🏆 P2 WINS!')
      : (d.w===1 ? '🩷 P1 POINT' : d.w===2 ? '💚 P2 POINT' : 'DRAW');
    showRoundScreen(msg, `${d.sc[0]}  –  ${d.sc[1]}`, d.over);
    if (!d.over) setTimeout(hideRoundScreen, 2600);
    if (d.w!==0) sndDeath();
    if (d.over) setTimeout(sndWin, 280);
  }
  draw() {
    cx.save(); cx.translate(this.shX, this.shY);
    drawBg(); this.plat.draw();
    for (const c of this.chars) c.draw();
    this.sparks.draw();
    cx.restore();
  }
}

// ════════════════════════════════════
//  UI helpers
// ════════════════════════════════════
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}
function showRoundScreen(msg, sub, showBack=false) {
  document.getElementById('rnd-title').textContent = msg;
  document.getElementById('rnd-sub').textContent = sub;
  document.getElementById('rnd-back').style.display = showBack ? 'block' : 'none';
  show('s-round');
}
function hideRoundScreen() { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); }
function updateHUD(sc) {
  for (let p=1;p<=2;p++) {
    const box = document.getElementById(`p${p}pips`);
    box.innerHTML = '';
    for (let i=0;i<3;i++) {
      const el=document.createElement('div');
      el.className='pip'+(i<sc[p-1]?' filled':'');
      box.appendChild(el);
    }
  }
}
function goTitle() {
  if (START_TIMER) { clearTimeout(START_TIMER); START_TIMER=null; }
  if (PEER) { PEER.destroy(); PEER=null; CONN=null; }
  if (LOOP) { cancelAnimationFrame(LOOP); LOOP=null; }
  GAME=null;
  document.removeEventListener('keydown',onKD);
  document.removeEventListener('keyup',onKU);
  document.getElementById('hud').style.display='none';
  show('s-title');
}
function showHost() { show('s-host'); initPeer('host'); }
function showJoin() {
  document.getElementById('join-input').value='';
  document.getElementById('join-st').textContent='';
  show('s-join');
}
function doJoin() {
  const code=document.getElementById('join-input').value.trim();
  if (code.length!==4) { document.getElementById('join-st').textContent='4文字で入力してください'; return; }
  document.getElementById('join-st').textContent='接続中…';
  initPeer('guest',code);
}

// ════════════════════════════════════
//  Networking (PeerJS)
// ════════════════════════════════════
let PEER=null, CONN=null, GAME=null, LOOP=null, ROLE=null, START_TIMER=null;
function genCode() {
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
}
function initPeer(role,joinCode) {
  ROLE=role;
  const pid=role==='host'?'gnfight-'+genCode():undefined;
  PEER=new Peer(pid);
  PEER.on('open',id=>{
    if (role==='host') {
      const code=id.replace('gnfight-','');
      document.getElementById('hst-code').textContent=code.split('').join(' ');
      document.getElementById('hst-wait').textContent='相手の接続を待っています…';
    } else {
      CONN=PEER.connect('gnfight-'+joinCode,{reliable:false,serialization:'json'});
      setupConn(CONN);
    }
  });
  PEER.on('connection',conn=>{
    if (role==='host') {
      CONN=conn; setupConn(CONN);
      document.getElementById('hst-wait').textContent='接続完了！ゲーム開始…';
      START_TIMER = setTimeout(()=>{ START_TIMER=null; startGame('host'); },1200);
    }
  });
  PEER.on('error',err=>{
    const m='エラー: '+(err.type||err.message);
    if (role==='host') document.getElementById('hst-wait').textContent=m;
    else document.getElementById('join-st').textContent=m;
  });
}
function setupConn(conn) {
  conn.on('open',()=>{ if (ROLE==='guest') startGame('guest'); });
  conn.on('data',d=>{
    if (!GAME) return;
    if (d.t==='st'&&ROLE==='guest') GAME.applyState(d.s);
    else if (d.t==='in'&&ROLE==='host') GAME.p2in=d.i;
    else if (d.t==='rnd'&&ROLE==='guest') GAME.applyRoundResult(d);
  });
  conn.on('close',()=>{ if (GAME) showRoundScreen('接続が切れました','再接続してください',true); });
}

// ════════════════════════════════════
//  Start game — fixed timestep loop
// ════════════════════════════════════
function startGame(role) {
  ROLE=role;
  GAME=new Game(role,data=>{ if (CONN&&CONN.open) CONN.send(data); });
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('hud').style.display='flex';
  updateHUD([0,0]);
  show('s-controls');
  setTimeout(()=>{ hideRoundScreen(); countdown(3,()=>{ if (GAME) GAME.phase='playing'; }); },2800);
  document.addEventListener('keydown',onKD);
  document.addEventListener('keyup',onKU);

  let lastTs=performance.now(), acc=0, lastNet=0;
  function loop(ts) {
    LOOP=requestAnimationFrame(loop);
    const elapsed=Math.min((ts-lastTs)/1000,0.05);
    lastTs=ts; acc+=elapsed;
    while (acc>=DT) { GAME.update(); acc-=DT; }
    cx.clearRect(0,0,W,H); GAME.draw();
    if (CONN&&CONN.open) {
      if (ROLE==='host'&&ts-lastNet>45) {
        lastNet=ts;
        CONN.send({t:'st',s:GAME.serializeState()});
        const [c1,c2]=GAME.chars;
        c1.netLand=false; c1.netJump=false;
        c2.netLand=false; c2.netJump=false;
        GAME._netHit=false;
      } else if (ROLE==='guest') {
        CONN.send({t:'in',i:GAME.p2in});
      }
    }
  }
  LOOP=requestAnimationFrame(loop);
}

function countdown(n,cb) {
  const el=document.getElementById('countdown');
  const colors=['#ff2470','#a040ff','#00e5b0'];
  if (n===0) {
    el.textContent='GO!'; el.style.color='#fff'; el.style.opacity='1';
    sndBeep(1320,0.28,0.22);
    setTimeout(()=>{ el.style.opacity='0'; cb(); },700); return;
  }
  el.textContent=n; el.style.color=colors[n-1]||'#fff'; el.style.opacity='1';
  sndBeep(660,0.18,0.1);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>countdown(n-1,cb),300); },700);
}

// ════════════════════════════════════
//  Input
// ════════════════════════════════════
function onKD(e) {
  if (!GAME) return;
  getAC(); // unlock AudioContext on first gesture
  const k=e.key.toLowerCase();
  if (ROLE==='host') {
    if (k==='a')          { GAME.p1in.left =true; e.preventDefault(); }
    if (k==='d')          { GAME.p1in.right=true; e.preventDefault(); }
    if (k==='w')          { GAME.p1in.jump =true; e.preventDefault(); }
    if (k==='s')          { GAME.p1in.punch=true; e.preventDefault(); }
  }
  if (ROLE==='guest') {
    if (k==='arrowleft')  { GAME.p2in.left =true; e.preventDefault(); }
    if (k==='arrowright') { GAME.p2in.right=true; e.preventDefault(); }
    if (k==='arrowup')    { GAME.p2in.jump =true; e.preventDefault(); }
    if (k==='arrowdown')  { GAME.p2in.punch=true; e.preventDefault(); }
  }
}
function onKU(e) {
  if (!GAME) return;
  const k=e.key.toLowerCase();
  if (ROLE==='host') {
    if (k==='a') GAME.p1in.left =false;
    if (k==='d') GAME.p1in.right=false;
    if (k==='w') GAME.p1in.jump =false;
    if (k==='s') GAME.p1in.punch=false;
  }
  if (ROLE==='guest') {
    if (k==='arrowleft')  GAME.p2in.left =false;
    if (k==='arrowright') GAME.p2in.right=false;
    if (k==='arrowup')    GAME.p2in.jump =false;
    if (k==='arrowdown')  GAME.p2in.punch=false;
  }
}

// ════════════════════════════════════
//  Idle render — mech characters preview
// ════════════════════════════════════
let idleT=0;
function drawIdleChar(bx, by, t, isP1) {
  const s = H * 0.048;
  const ACC  = isP1 ? '#ff2470' : '#00e5b0';
  const ACCD = isP1 ? '#7a0030' : '#006640';
  const M='#1c2238', MH='#4c5880', MS='#070a1a', MSP='#a0b0d0';
  const wobX = Math.sin(t*1.3)*10, wobY = Math.cos(t*0.9)*5;
  const x=bx+wobX, y=by+wobY;
  // Legs
  const la = Math.sin(t*2.1)*0.35, ra = -la;
  drawCyl(x-s*0.45, y, x-s*0.45+Math.sin(t*2)*s*0.35, y+s*1.5+Math.cos(t*1.8)*s*0.2, s*0.30, M,MSP,MS);
  drawCyl(x+s*0.45, y, x+s*0.45-Math.sin(t*2)*s*0.35, y+s*1.5-Math.cos(t*1.8)*s*0.2, s*0.30, M,MSP,MS);
  // Arms
  drawCyl(x-s*0.9, y-s*0.7, x-s*0.9+Math.sin(t*1.7)*s*0.5, y-s*0.7+Math.cos(t*1.7)*s*0.7, s*0.24, M,MH,MS);
  drawCyl(x+s*0.9, y-s*0.7, x+s*0.9-Math.sin(t*1.7)*s*0.5, y-s*0.7+Math.cos(t*1.7)*s*0.7, s*0.24, M,MH,MS);
  // Torso
  drawCyl(x, y, x, y-s*1.5, s*0.85, M, MSP, MS);
  // Chest orb
  const og=cx.createRadialGradient(x-s*0.05,y-s*0.5,0, x,y-s*0.5,s*0.30);
  og.addColorStop(0,'#fff'); og.addColorStop(0.35,ACC); og.addColorStop(1,ACCD+'33');
  cx.fillStyle=og; cx.beginPath(); cx.arc(x,y-s*0.5,s*0.26,0,Math.PI*2); cx.fill();
  // Head
  drawSph(x, y-s*2.15, s*1.08, M, MSP, MS);
  // Visor
  const vg=cx.createLinearGradient(x-s*0.7,0,x+s*0.7,0);
  vg.addColorStop(0,ACCD+'44'); vg.addColorStop(0.25,ACC+'bb'); vg.addColorStop(0.55,'#ffffffcc'); vg.addColorStop(0.85,ACC+'cc'); vg.addColorStop(1,ACCD+'44');
  cx.fillStyle=vg; cx.beginPath(); cx.ellipse(x+s*0.14,y-s*2.18,s*0.72,s*0.22,0,0,Math.PI*2); cx.fill();
  // Antenna
  drawCyl(x+s*0.18,y-s*3.0,x+s*0.18,y-s*3.55,s*0.045,M,MSP,MS);
  drawSph(x+s*0.18,y-s*3.55,s*0.09,ACC,'#fff',ACCD);
}

(function idleLoop() {
  if (GAME) return;
  requestAnimationFrame(idleLoop);
  idleT += 0.016;
  drawBg();
  drawIdleChar(W*0.33, H*0.50, idleT,         true);
  drawIdleChar(W*0.67, H*0.50, idleT+Math.PI,  false);
})();
</script>
