name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Validate content (if present)
        run: |
          if [ -f scripts/validate-content.mjs ]; then
            node scripts/validate-content.mjs
          else
            echo "scripts/validate-content.mjs not present yet — skipping."
          fi
