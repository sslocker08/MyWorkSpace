<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face {
        font-family: 'Serif';
        src: local('Georgia'), local('Times New Roman'), serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#F3EFE4"/>

  <!-- Seigaiha pattern -->
  
    <g transform="translate(400, 400) rotate(95)">
      <g fill="none" stroke="#33518F" stroke-width="2" opacity="0.09999999999999999">
        <path d="M 320 400 A 80 80 0 0 1 480 400" />
<path d="M 280 400 A 120 120 0 0 1 520 400" />
<path d="M 240 400 A 160 160 0 0 1 560 400" />
<path d="M 200 400 A 200 200 0 0 1 600 400" />
<path d="M 160 400 A 240 240 0 0 1 640 400" />
      </g>
    </g>
  

  <!-- Center circle -->
  <circle cx="400" cy="400" r="200" fill="none" stroke="#7FA3C7" stroke-width="3" opacity="0.3"/>

  <!-- Initials text -->
  <text x="400" y="440" font-size="120" font-family="Serif" font-weight="bold" text-anchor="middle" fill="#2E2E35" opacity="0.6">
    KI
  </text>

  <!-- Vermilion seal square -->
  <g transform="translate(720, 720)">
    <rect width="40" height="40" fill="#C2451E"/>
    <circle cx="20" cy="20" r="8" fill="#F3EFE4" opacity="0.4"/>
