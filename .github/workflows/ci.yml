name: ci

on:
  push:
    branches:
      - 'claude/stock-signal-bot-qwpudr'
      - 'main'
  pull_request:

jobs:
  engine-test:
    name: Engine tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: signalbot_test
          POSTGRES_USER: signalbot
          POSTGRES_PASSWORD: signalbot
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: signal-bot/engine

    env:
      DATABASE_URL: postgresql+asyncpg://signalbot:signalbot@localhost/signalbot_test
      REDIS_URL: redis://localhost:6379
      # Prevent live API calls during tests (all network calls are mocked)
      POLYGON_API_KEY: test-key
      FRED_API_KEY: test-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: signal-bot/engine/requirements.txt

      - name: Install TA-Lib system library (source-build fallback)
        run: sudo apt-get update -q && sudo apt-get install -y libta-lib-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  web-build:
    name: Web build (tsc + next build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: signal-bot/web

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: signal-bot/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
